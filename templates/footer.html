{% load static %}
<!-- untuk code footer (pakai Tailwind))-->
<footer class="bg-[#274636] text-[#F4DEA4] py-12 px-6 sm:px-12 mt-auto">
    <div class="max-w-7xl mx-auto">

        <!-- Bagian atas: ada logo & deskripsi -->
        <div class="flex flex-col md:flex-row justify-between items-start gap-6 mb-8">
            <div class="space-y-4 max-w-full">
                <!-- logo & brand -->
                <div class="flex items-center gap-3">
                    <!-- buat logo -->
                    <!-- Logo Gambar Asli -->
                    <div class="flex items-center gap-3">
                        <img src="{% static 'img/Logo.png' %}" alt="LeftOver Logo" class="h-10 w-auto object-contain">
                        <img src="{% static 'img/TextLogo.png' %}" alt="LeftOver Logo" class="h-10 w-auto object-contain">
                    </div>
                </div>
                
                <!-- Teks deskripsi -->
                <p class="text-xs sm:text-sm text-[#F4DEA4]/90 leading-relaxed font-sans">
                Membantu anak kos, mahasiswa, dan keluarga meracik makanan lezat bernutrisi dari sisa bahan kulkas.<br>
                Hemat uang saku, kurangi sampah organik dapur, dan rawat bumi satu hidangan pada satu waktu.
                </p>
            </div>
        </div>

        <!-- garis pemisah -->
        <hr class="border-t border-[#F4DEA4]/20 mb-6">

        <!-- Bagian bawah: copyright dan lokasi kita -->
        <div class="flex flex-col sm:flex-row items-center justify-between text-xs sm:text-sm text-[#F4DEA4]/80 gap-3">
            <p>© 2026 LeftOver – PBP A-03</p>
            <p>Depok, Jawa Barat, Indonesia</p>
        </div>
    </div>
</footer>
