{% load static %}

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}LeftOver{% endblock %}
    </title>
    
    <!-- Untuk Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}
    {% endblock %}
</head>

<body>

    {% include "navbar.html" %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include "toast.html" %}

    {% block extra_js %}
    {% endblock %}

    <!-- add footer -->
    {% include 'footer.html' %} 
</body>
</html>
