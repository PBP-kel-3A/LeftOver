{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}LeftOver{% endblock %}
    </title>
    
    <!-- Untuk Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Add google Fonts: Montserrat (Headings) & Plus Jakarta Sans (Body text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Konfigurasi font Tailwind supaya bisa dipanggil via class font-montserrat & font-jakarta -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                        jakarta: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}
    {% endblock %}
</head>

<body class="font-jakarta bg-white">

    {% include "navbar.html" %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include "toast.html" %}

    {% block extra_js %}
    {% endblock %}

    <!-- add footer -->
    {% include 'footer.html' %} 

    <!-- Navbar JavaScript -->
    <script src="{% static 'js/navbar.js' %}" defer></script>
    <!-- Toast JavaScript -->
    <script src="{% static 'js/toast.js' %}" defer></script>
</body>
</html>
