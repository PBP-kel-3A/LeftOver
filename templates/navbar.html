{% load static %}

<nav class="navbar">
    <div class="navbar-container">

        <!-- Logo -->
        <a href="{% url 'main:landing' %}" class="navbar-brand">
            <img
                src="{% static 'img/Logo.png' %}"
                alt="LeftOver Logo"
                class="navbar-logo"
            >

            <img
                src="{% static 'img/TextLogo.png' %}"
                alt="LeftOver"
                class="navbar-text-logo"
            >
        </a>

        <!-- Navigation -->
        <div class="navbar-links">

            <a href="{% url 'main:landing' %}">
                Home
            </a>

            <a href="{% url 'recipes:recipe_list' %}">
                Katalog Resep
            </a>

            <a href="{% url 'pantry:pantry_list' %}" class="nav-dropdown">
                <span>Dapur Saya</span>
                <span class="nav-arrow"></span>
            </a>

            <a href="#">
                Favorite
            </a>

        </div>

        <!-- Authentication -->
        <div class="navbar-auth">
            {% if user.is_authenticated %}
                <!-- kalau user sudah login: tampilkan nama akun dan tombol logout aja -->
                <!-- class dari tombolnya disamakan dengan class login-logout -->
                <span class="nav-login">
                    Halo, {{ user.username }}
                </span>
                
                <form action="{% url 'main:logout' %}" method="POST" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="nav-register">
                        Logout
                    </button>
                </form>
            {% else %}
                <!-- kalau user belum login: tampilkan tombol Login dan Register -->
                <a href="{% url 'main:login' %}" class="nav-login">
                    Login
                </a>
                <a href="{% url 'main:register' %}" class="nav-register">
                    Register
                </a>
            {% endif %}
        </div>
    </div>
</nav>
